    html, body {

      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #tydes-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 20%, rgba(95, 214, 205, .28), transparent 30%),
        radial-gradient(circle at 82% 78%, rgba(248, 196, 109, .22), transparent 34%),
        #f8f7f2;
      transition: opacity .25s ease;
      z-index: 1;
    }
    .tydes-loader-card { text-align: center; }
    .tydes-loader-mark {
      width: 74px;
      height: 74px;
      margin: 0 auto;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(10, 74, 82, .2);
    }
    .tydes-loader-mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .tydes-loader-card strong { display: block; margin-top: 16px; font-size: 22px; }
    .tydes-loader-card span { display: block; margin-top: 6px; color: #607175; font-size: 14px; }
  </style>
